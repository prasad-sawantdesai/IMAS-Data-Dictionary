version: 2

build:
  os: "ubuntu-22.04"
  apt_packages:
      - openjdk-21-jdk
      - libsaxon-java
  tools:
    python: "3.11"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
      - mkdir -p ~/saxonhe/
      - echo "Downloading Saxon-HE jar"
      - wget -O ~/saxonhe/saxon-he.jar "https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.4/Saxon-HE-12.4.jar"
      - ls -ltr ~/saxonhe/saxon-he.jar
      - export CLASSPATH=$CLASSPATH:/usr/local/bin/saxon-he.jar
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      
sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: false
